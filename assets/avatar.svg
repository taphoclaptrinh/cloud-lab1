<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd8b3" />
      <stop offset="100%" stop-color="#f5b888" />
    </linearGradient>
    <linearGradient id="clothGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)" stroke="#60a5fa" stroke-width="6"/>

  <!-- Subtle grid/cloud pattern -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Body / Shoulders -->
  <path d="M 100 350 C 100 280, 150 260, 200 260 C 250 260, 300 280, 300 350 Z" fill="url(#clothGrad)" />

  <!-- Inner Collar / Shirt -->
  <polygon points="180,260 220,260 200,300" fill="#38bdf8" />

  <!-- Neck -->
  <rect x="180" y="220" width="40" height="50" rx="8" fill="url(#skinGrad)" />

  <!-- Head -->
  <ellipse cx="200" cy="180" rx="60" ry="70" fill="url(#skinGrad)" />

  <!-- Hair -->
  <path d="M 140 170 C 135 120, 170 100, 200 100 C 240 100, 265 120, 260 170 C 250 140, 230 130, 200 130 C 170 130, 150 140, 140 170 Z" fill="#1e293b" />

  <!-- Eyeglasses -->
  <rect x="155" y="165" width="35" height="25" rx="6" fill="none" stroke="#0f172a" stroke-width="4"/>
  <rect x="210" y="165" width="35" height="25" rx="6" fill="none" stroke="#0f172a" stroke-width="4"/>
  <line x1="190" y1="177" x2="210" y2="177" stroke="#0f172a" stroke-width="4"/>

  <!-- Eyes -->
  <circle cx="172" cy="177" r="4" fill="#0f172a" />
  <circle cx="228" cy="177" r="4" fill="#0f172a" />

  <!-- Smile -->
  <path d="M 185 215 Q 200 228 215 215" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />

  <!-- Headphones / Tech accessory -->
  <path d="M 132 180 A 70 70 0 0 1 268 180" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  <rect x="125" y="165" width="16" height="32" rx="6" fill="#0284c7" />
  <rect x="259" y="165" width="16" height="32" rx="6" fill="#0284c7" />

  <!-- AI / Student Badge -->
  <g transform="translate(270, 280)">
    <circle cx="25" cy="25" r="30" fill="#0ea5e9" stroke="#ffffff" stroke-width="3"/>
    <text x="25" y="32" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">AI</text>
  </g>
</svg>
