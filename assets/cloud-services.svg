<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <defs>
    <filter id="shadowBox" x="-5%" y="-10%" width="110%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.1" />
    </filter>
  </defs>

  <rect width="600" height="320" rx="16" fill="#f8fafc" />

  <!-- Title inside SVG -->
  <text x="300" y="40" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#1e293b" text-anchor="middle">Cloud Service Layers</text>

  <!-- Layer 1: SaaS (Top - End Users) -->
  <g transform="translate(130, 65)" filter="url(#shadowBox)">
    <rect width="340" height="60" rx="8" fill="#38bdf8" />
    <text x="170" y="28" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">SaaS — Software as a Service</text>
    <text x="170" y="48" font-family="'Segoe UI', sans-serif" font-size="12" fill="#0f172a" opacity="0.8" text-anchor="middle">End-user apps (Google Docs, Office 365, Gmail)</text>
  </g>

  <!-- Layer 2: PaaS (Middle - Developers) -->
  <g transform="translate(90, 145)" filter="url(#shadowBox)">
    <rect width="420" height="60" rx="8" fill="#2563eb" />
    <text x="210" y="28" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">PaaS — Platform as a Service</text>
    <text x="210" y="48" font-family="'Segoe UI', sans-serif" font-size="12" fill="#e0e7ff" text-anchor="middle">Development environments &amp; hosting (Heroku, AWS Beanstalk, App Engine)</text>
  </g>

  <!-- Layer 3: IaaS (Bottom - SysAdmins / Infrastructure) -->
  <g transform="translate(50, 225)" filter="url(#shadowBox)">
    <rect width="500" height="60" rx="8" fill="#1e3a8a" />
    <text x="250" y="28" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">IaaS — Infrastructure as a Service</text>
    <text x="250" y="48" font-family="'Segoe UI', sans-serif" font-size="12" fill="#93c5fd" text-anchor="middle">Virtual machines, networking &amp; storage (AWS EC2, Azure VMs)</text>
  </g>
</svg>
